name: Build and publish Minecraft CDN files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download authorized game build
        run: |
          curl -fL --retry 3 \
            "https://github.com/joeymavv/26.3-JM/releases/download/v26.3-jm.1/26.3-fixed.html" \
            -o 26.3-fixed.html
          echo "1716c4673de4ab5b03ac9ac6ebe8d4db1358f6008825b84fcb4bb05c7228a610  26.3-fixed.html" | sha256sum -c -

      - name: Split into CDN-sized chunks
        run: |
          rm -rf cdn
          mkdir -p cdn/chunks
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const input = fs.readFileSync('26.3-fixed.html');
          const size = 10 * 1024 * 1024;
          let index = 0;
          for (let offset = 0; offset < input.length; offset += size) {
            const chunk = input.subarray(offset, Math.min(offset + size, input.length));
            fs.writeFileSync(`cdn/chunks/part-${String(index).padStart(3, '0')}.bin`, chunk);
            index++;
          }
          fs.writeFileSync('cdn/manifest.json', JSON.stringify({
            chunkCount: index,
            chunkSize: size,
            totalBytes: input.length,
            sha256: crypto.createHash('sha256').update(input).digest('hex')
          }, null, 2));
          console.log(`Created ${index} chunks from ${input.length} bytes`);
          NODE

      - name: Commit CDN files to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdn/
          if git diff --cached --quiet; then
            echo "CDN files are already up to date."
          else
            git commit -m "Publish Minecraft 26.3-JM CDN files"
            git push
          fi
