<!-- Minecraft 26.3-JM: paste this entire block into a Google Sites code embed -->
<div id="minecraft-root" style="width:100%;height:600px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font:14px Arial,sans-serif;">
  <div id="minecraft-status">Loading Minecraft files…</div>
  <div style="width:min(80%,420px);height:8px;background:#333;margin-top:14px;border-radius:8px;overflow:hidden;">
    <div id="minecraft-progress" style="width:0%;height:100%;background:#4caf50;"></div>
  </div>
</div>
<script>
(async () => {
  const status = document.getElementById('minecraft-status');
  const progress = document.getElementById('minecraft-progress');
  const base = 'https://cdn.jsdelivr.net/gh/tonybalony76/njmfdqbes-26.3@main/cdn';

  try {
    status.textContent = 'Loading file list…';
    const response = await fetch(base + '/manifest.json');
    if (!response.ok) throw new Error('Manifest request failed: ' + response.status);
    const manifest = await response.json();

    if (!Number.isInteger(manifest.chunkCount) || manifest.chunkCount < 1 ||
        !Number.isInteger(manifest.totalBytes) || manifest.totalBytes < 1) {
      throw new Error('The CDN manifest is invalid.');
    }

    const parts = [];
    let received = 0;

    for (let i = 0; i < manifest.chunkCount; i++) {
      status.textContent = 'Loading game files… ' + (i + 1) + '/' + manifest.chunkCount;
      const name = 'part-' + String(i).padStart(3, '0') + '.bin';
      const partResponse = await fetch(base + '/chunks/' + name);
      if (!partResponse.ok) throw new Error(name + ' failed: ' + partResponse.status);
      const data = await partResponse.arrayBuffer();
      parts.push(new Uint8Array(data));
      received += data.byteLength;
      progress.style.width = Math.min(100, Math.round(received / manifest.totalBytes * 100)) + '%';
    }

    if (received !== manifest.totalBytes) {
      throw new Error('Downloaded file size does not match the manifest.');
    }

    status.textContent = 'Assembling Minecraft…';
    const combined = new Uint8Array(received);
    let offset = 0;
    for (const part of parts) {
      combined.set(part, offset);
      offset += part.length;
    }

    // Run the game in this embed document instead of a nested iframe.
    // This removes an extra iframe permission boundary for mouse input.
    const gameHtml = new TextDecoder('utf-8').decode(combined);
    document.open();
    document.write(gameHtml);
    document.close();
  } catch (error) {
    status.textContent = 'Minecraft could not load: ' + error.message;
    status.style.color = '#ff7777';
  }
})();
</script>
