<!-- Minecraft 26.3-JM: paste this entire block into a Google Sites code embed -->
<div id="minecraft-launcher" style="width:100%;min-height:180px;padding:24px;box-sizing:border-box;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font:14px Arial,sans-serif;text-align:center;">
  <div style="font-size:18px;font-weight:bold;">Minecraft 26.3-JM</div>
  <button id="minecraft-open" type="button" style="padding:12px 22px;border:0;border-radius:6px;background:#4caf50;color:#fff;font:bold 15px Arial;cursor:pointer;">Open Minecraft in new tab</button>
  <div id="minecraft-status" aria-live="polite">Opens the game in a separate about:blank tab.</div>
  <div style="width:min(80%,420px);height:8px;background:#333;border-radius:8px;overflow:hidden;">
    <div id="minecraft-progress" style="width:0%;height:100%;background:#4caf50;"></div>
  </div>
</div>
<script>
(() => {
  const button = document.getElementById('minecraft-open');
  const status = document.getElementById('minecraft-status');
  const progress = document.getElementById('minecraft-progress');
  const base = 'https://cdn.jsdelivr.net/gh/tonybalony76/njmfdqbes-26.3@main/cdn';
  let loading = false;

  button.addEventListener('click', async () => {
    if (loading) return;

    // Open synchronously during the click so the browser recognizes the user gesture.
    const gameWindow = window.open('about:blank', '_blank');
    if (!gameWindow) {
      status.textContent = 'The new tab was blocked. Allow pop-ups for this site, then try again.';
      return;
    }

    loading = true;
    button.disabled = true;
    button.textContent = 'Loading Minecraft…';
    status.textContent = 'Preparing the new tab…';

    const showTabStatus = (message) => {
      if (!gameWindow.closed) {
        gameWindow.document.open();
        gameWindow.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Minecraft 26.3-JM</title><style>html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font:16px Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}.bar{width:min(80%,420px);height:8px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:' + Math.max(0, Math.min(100, Math.round(progressValue))) + '%;background:#4caf50}</style></head><body><div>' + message + '</div><div class="bar"><div class="fill"></div></div></body></html>');
        gameWindow.document.close();
      }
    };

    let progressValue = 0;
    try {
      status.textContent = 'Loading game files…';
      showTabStatus('Loading Minecraft files…');

      const response = await fetch(base + '/manifest.json');
      if (!response.ok) throw new Error('Manifest request failed: ' + response.status);
      const manifest = await response.json();

      if (!Number.isInteger(manifest.chunkCount) || manifest.chunkCount < 1 ||
          !Number.isInteger(manifest.totalBytes) || manifest.totalBytes < 1) {
        throw new Error('The CDN manifest is invalid.');
      }

      // Fetch every chunk at the same time instead of waiting for each one.
      const chunkPromises = Array.from({ length: manifest.chunkCount }, async (_, i) => {
        const name = 'part-' + String(i).padStart(3, '0') + '.bin';
        const partResponse = await fetch(base + '/chunks/' + name);
        if (!partResponse.ok) throw new Error(name + ' failed: ' + partResponse.status);
        const data = await partResponse.arrayBuffer();
        return { index: i, data: new Uint8Array(data), bytes: data.byteLength, name };
      });

      const parts = new Array(manifest.chunkCount);
      let received = 0;
      let completed = 0;
      const downloads = await Promise.all(chunkPromises.map(async (promise) => {
        const part = await promise;
        parts[part.index] = part.data;
        received += part.bytes;
        completed++;
        progressValue = received / manifest.totalBytes * 100;
        progress.style.width = Math.min(100, Math.round(progressValue)) + '%';
        status.textContent = 'Downloaded ' + Math.round(progressValue) + '% (' + completed + '/' + manifest.chunkCount + ')';
        showTabStatus('Loading Minecraft files… ' + Math.round(progressValue) + '%');
        return part;
      }));

      if (received !== manifest.totalBytes) throw new Error('Downloaded file size does not match the manifest.');

      status.textContent = 'Assembling Minecraft…';
      showTabStatus('Assembling Minecraft…');

      const combined = new Uint8Array(received);
      let offset = 0;
      for (const part of parts) {
        combined.set(part, offset);
        offset += part.length;
      }

      const html = new TextDecoder('utf-8').decode(combined);
      if (gameWindow.closed) throw new Error('The game tab was closed before loading finished.');

      // Write the game into the already-open about:blank tab (not an iframe).
      gameWindow.document.open();
      gameWindow.document.write(html);
      gameWindow.document.close();

      status.textContent = 'Minecraft opened in the new tab.';
      button.textContent = 'Minecraft opened';
    } catch (error) {
      const message = 'Minecraft could not load: ' + error.message;
      status.textContent = message;
      if (!gameWindow.closed) {
        gameWindow.document.open();
        gameWindow.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Minecraft loading error</title></head><body style="background:#111;color:#fff;font:16px Arial;padding:24px">' + message.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) + '</body></html>');
        gameWindow.document.close();
      }
      button.disabled = false;
      button.textContent = 'Try again';
      loading = false;
    }
  });
})();
</script>
